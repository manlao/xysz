<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大类资产配置 · 当前配置</title>
<style>
  :root { --ink:#2c3e50; --muted:#7a8ba0; --line:#e3ecf5; --panel:#ffffff; --bg:#f4f8fc;
          --gold:#c9a227; --bond:#4a90d9; --broad:#e07a5f; --cash:#7fb98a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink);
         font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif; }
  .wrap { max-width:1080px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; font-weight:600; margin-bottom:6px; }
  .meta { color:var(--muted); font-size:12.5px; line-height:1.7; margin-bottom:18px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px; }
  .card { background:var(--panel); border-radius:14px; padding:14px 16px; box-shadow:0 1px 4px rgba(44,62,80,.06); }
  .card .k { color:var(--muted); font-size:12px; margin-bottom:6px; }
  .card .v { font-size:22px; font-weight:600; }
  .card .s { color:var(--muted); font-size:11px; margin-top:4px; }
  .pos { color:#d5484d; } .neg { color:#2e9e63; }
  .panel { background:var(--panel); border-radius:14px; padding:18px; margin-bottom:18px;
           box-shadow:0 1px 4px rgba(44,62,80,.06); }
  .panel h2 { font-size:15px; font-weight:600; margin-bottom:12px; }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:right; padding:8px 10px; background:#f0f6fc; color:var(--muted);
       font-weight:500; white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  td { text-align:right; padding:8px 10px; border-top:1px solid var(--line); white-space:nowrap; }
  tr.hl td { font-weight:600; background:#f7fafd; }
  .bar { display:flex; height:26px; border-radius:8px; overflow:hidden; margin-bottom:6px; }
  .bar div { height:100%; }
  .brow { margin-bottom:14px; }
  .blabel { font-size:12px; color:var(--muted); margin-bottom:4px; }
  .pfnote { color:var(--muted); font-size:12px; line-height:1.8; margin-top:10px; }
  .disc { background:#fff8f6; border:1px solid #f3ddd6; color:#a4634a; border-radius:12px;
          padding:12px 14px; font-size:12.5px; line-height:1.8; }
  @media (max-width:640px) {
    .wrap { padding:14px 10px 36px; }
    h1 { font-size:19px; }
    .card .v { font-size:18px; }
    th, td { padding:6px 8px; font-size:12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>大类资产配置 · 当前配置</h1>
  <div class="meta">__META_LINE__</div>

  <div class="panel"><h2>窗口内各资产年化收益 / 年化波动</h2>
    <div class="cards">__CARDS__</div>
    <div class="pfnote">__CASH_NOTE__</div></div>

  <div class="panel"><h2>各模型权重对比</h2>__BARS__
    <div class="scroll"><table>__WEIGHT_TABLE__</table></div></div>

  <div class="panel"><h2>模型与口径说明</h2>
    <div class="pfnote">__MODEL_NOTES__</div></div>

  <div class="disc">__DISCLAIMER__</div>
</div>
</body>
</html>
